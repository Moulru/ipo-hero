name: 웹 배포 (GitHub Pages)

# 코드 변경 시 Vite 앱을 빌드해 GitHub Pages로 배포한다.
# 데이터 커밋(ipos.json)에는 트리거하지 않음 — 데이터는 앱이 raw URL에서 런타임 fetch 하므로
# 사이트를 매번 다시 빌드할 필요가 없다(빌드 분 절약).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/ipos.json'
      - 'public/ipos.json'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 빌드
        env:
          # 프로젝트 사이트(username.github.io/<repo>/) 대응 base path
          VITE_BASE: /${{ github.event.repository.name }}/
          # 라이브 데이터는 cron이 갱신하는 raw 파일에서 fetch (사이트 재배포 없이 최신 유지)
          VITE_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/public/ipos.json
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
